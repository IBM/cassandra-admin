<!-- Connection Details Home View -->
<template x-if="!entityData && !entityLoading">
  <div
    class="d-flex flex-column align-items-center justify-content-center position-absolute top-50 start-50 translate-middle w-100">
    <i class="bi bi bi-database-fill fs-1 mb-3 text-secondary"></i>
    <h4 class="text-secondary text-center user-select-none">Select an item from the sidebar</h4>
    <div class="text-muted text-center small">Connection Information:
      <div>Host: <strong x-text="connection ? connection.host : ''"></strong></div>
      <div>Cassandra Version: <strong x-text="connection ? connection.cassandra_version : ''"></strong></div>
      <div>Cluster Name: <strong x-text="connection ? connection.cluster_name : ''"></strong></div>
    </div>
  </div>
</template>
